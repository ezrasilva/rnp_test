[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openran-pqc-collector"
version = "0.2.0"
description = "gRPC telemetry collector for OpenRAN PQC experiments"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.74,<2", "protobuf>=6,<7"]

[project.scripts]
pqc-collector = "pqc_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
